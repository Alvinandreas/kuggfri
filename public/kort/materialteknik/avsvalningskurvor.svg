<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" role="img" aria-labelledby="titel" font-family="system-ui, sans-serif" font-size="17" fill="#111">
<title id="titel">Tre avsvalningskurvor, temperatur mot tid: en ren metall med en platå vid smälttemperaturen; en legering som stelnar till en enda fas med en knick vid likvidus, en flackare del och en knick vid solidus; en legering med primär fas och eutektikum med en knick vid likvidus, en flackare del och en platå vid den eutektiska temperaturen.</title>
