<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 398" role="img" aria-labelledby="titel" font-family="system-ui, sans-serif" font-size="17" fill="#111">
<title id="titel">Spännings–töjningskurva från dragprov för en seg metall: lutningen i det elastiska området är E, sträckgränsen Rp0,2 fås där en linje parallell med den elastiska delen, förskjuten 0,2 % töjning, skär kurvan, brottgränsen Rm är kurvans högsta spänning och brottförlängningen är den plastiska töjningen efter brott.</title>
