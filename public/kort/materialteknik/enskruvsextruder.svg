<title id="titel">Enskruvsextruder: granulat matas från tratten in i cylindern, där skruven har en kyld inmatningszon, en uppvärmd smält- eller övergångszon och en doseringszon som bygger upp trycket och pressar smältan genom munstycket till ett extrudat.</title>
