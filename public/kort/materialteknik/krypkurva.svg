<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 345" role="img" aria-labelledby="titel" font-family="system-ui, sans-serif" font-size="17" fill="#111">
<title id="titel">Krypkurva: töjning mot tid vid konstant last och hög temperatur. Efter den initiala elastiska töjningen följer primär krypning, steady state-krypning med konstant töjningshastighet och tertiär krypning fram till brott.</title>
