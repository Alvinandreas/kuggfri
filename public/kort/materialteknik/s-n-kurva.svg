<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 372" role="img" aria-labelledby="titel" font-family="system-ui, sans-serif" font-size="17" fill="#111">
<title id="titel">S–N-kurva: spänningsamplituden mot antal cykler till brott i logaritmisk skala. Kurvan börjar vid draghållfastheten σts och planar ut; utmattningsgränsen σe är amplituden där brott sker först efter mycket många cykler, t.ex. 10⁷.</title>
<defs>
<marker id="pil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#111"/></marker>
<marker id="pilg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#1f7a4d"/></marker>
</defs>
<line x1="90" y1="310" x2="580" y2="310" stroke="#111" stroke-width="2" marker-end="url(#pil)"/><line x1="90" y1="310" x2="90" y2="30" stroke="#111" stroke-width="2" marker-end="url(#pil)"/><line x1="90" y1="310" x2="90" y2="316" stroke="#111" stroke-width="1.5"/><text x="90" y="334" text-anchor="middle" font-size="15" font-weight="400">1</text><line x1="148.8" y1="310" x2="148.8" y2="316" stroke="#111" stroke-width="1.5"/><text x="148.8" y="334" text-anchor="middle" font-size="15" font-weight="400">10</text><line x1="207.5" y1="310" x2="207.5" y2="316" stroke="#111" stroke-width="1.5"/><text x="207.5" y="334" text-anchor="middle" font-size="15" font-weight="400">10²</text><line x1="266.3" y1="310" x2="266.3" y2="316" stroke="#111" stroke-width="1.5"/><text x="266.3" y="334" text-anchor="middle" font-size="15" font-weight="400">10³</text><line x1="325" y1="310" x2="325" y2="316" stroke="#111" stroke-width="1.5"/><text x="325" y="334" text-anchor="middle" font-size="15" font-weight="400">10⁴</text><line x1="383.8" y1="310" x2="383.8" y2="316" stroke="#111" stroke-width="1.5"/><text x="383.8" y="334" text-anchor="middle" font-size="15" font-weight="400">10⁵</text><line x1="442.5" y1="310" x2="442.5" y2="316" stroke="#111" stroke-width="1.5"/><text x="442.5" y="334" text-anchor="middle" font-size="15" font-weight="400">10⁶</text><line x1="501.3" y1="310" x2="501.3" y2="316" stroke="#111" stroke-width="1.5"/><text x="501.3" y="334" text-anchor="middle" font-size="15" font-weight="700">10⁷</text><line x1="560" y1="310" x2="560" y2="316" stroke="#111" stroke-width="1.5"/><text x="560" y="334" text-anchor="middle" font-size="15" font-weight="400">10⁸</text><path d="M90,80 C200,195 330,236 501.25,245 C520,247 540,249 560,251" fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="90" y1="80" x2="165" y2="80" stroke="#111" stroke-width="1.5" stroke-dasharray="6 5"/><text x="172" y="86" font-size="17">σ<tspan dy="5" font-size="13">ts</tspan><tspan dy="-5"></tspan> (draghållfasthet)</text><line x1="90" y1="245" x2="575" y2="245" stroke="#1f7a4d" stroke-width="1.8" stroke-dasharray="6 5"/><line x1="501.3" y1="245" x2="501.3" y2="310" stroke="#111" stroke-width="1.5" stroke-dasharray="4 4"/><text x="110" y="233" font-size="17" font-weight="700" fill="#1f7a4d">utmattningsgräns σ<tspan dy="5" font-size="13">e</tspan><tspan dy="-5"></tspan></text><text x="495.3" y="275" text-anchor="end" font-size="15">10⁷ cykler</text><text x="335" y="364" text-anchor="middle" font-size="16">Antal cykler till brott, N<tspan dy="5" font-size="13">f</tspan><tspan dy="-5"></tspan> (logaritmisk skala)</text><text x="30" y="170" text-anchor="middle" font-size="16" transform="rotate(-90 30 170)">Spänningsamplitud σ<tspan dy="5" font-size="13">a</tspan></text>
</svg>
