<h2>Välj ett nytt lösenord</h2>

<p>Klicka på länken för att välja ett nytt lösenord till Kuggfri. Den fungerar på vilken enhet som helst och gäller i en timme.</p>

<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=%2Fkonto%3Fbyt-losenord%3D1">Välj nytt lösenord</a></p>

<p>Om du inte bad om att byta lösenord kan du ignorera det här mejlet. Ditt lösenord är oförändrat.</p>
